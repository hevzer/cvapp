<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="theme-color" content="#6366f1" />
    <title>CVapp — Professional CV Builder</title>
    <meta
      name="description"
      content="Create, preview, and download professional CVs with ATS-friendly and modern templates. Free, fast, and privacy-first — all data stays in your browser."
    />
    <link rel="icon" href="/cvapp_macos_logo.png" />
    <link rel="apple-touch-icon" href="/cvapp_macos_logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&family=Outfit:wght@300;400;500;600;700&family=Lora:wght@400;500;600;700&family=Merriweather:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/icons/bootstrap-icons.min.css" />

    <!-- Trunk Asset Directives -->
    <link data-trunk rel="copy-dir" href="node_modules/bootstrap-icons/font" data-target-path="icons" />
    <link data-trunk rel="copy-file" href="public/cvapp_macos_logo.png" />
    <link data-trunk rel="copy-file" href="public/manifest.json" />
    <link data-trunk rel="copy-file" href="public/sw.js" />
    <link data-trunk rel="copy-file" href="public/icon-192x192.png" />
    <link data-trunk rel="copy-file" href="public/icon-512x512.png" />
    <link data-trunk rel="copy-file" href="public/favicon.ico" />
    <link data-trunk rel="css" href="style/tailwind.css" />
    <link data-trunk rel="rust" data-target-name="cvapp" data-wasm-opt="z" data-wasm-opt-params="--all-features" />
  </head>
  <body class="font-sans antialiased">
    <script>
      (function() {
        const isLocal = window.location.hostname === 'localhost' ||
                        window.location.hostname === '127.0.0.1' ||
                        window.location.hostname === '[::1]' ||
                        window.location.protocol === 'tauri:' ||
                        typeof window.__TAURI_INTERNALS__ !== 'undefined' ||
                        typeof window.__TAURI__ !== 'undefined';

        if (isLocal) {
          // In local dev and desktop app, unregister any service workers and clear caches
          // to ensure instant live updates and prevent serving stale WASM or blank pages.
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (const reg of regs) {
                reg.unregister();
              }
            }).catch(function() {});
          }
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              for (const key of keys) {
                caches.delete(key);
              }
            }).catch(function() {});
          }
        } else if ('serviceWorker' in navigator) {
          // In production static web deployments, register PWA service worker
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js').catch(function() {});
          });
        }
      })();
    </script>
  </body>
</html>
