[package]
name = "cvapp-cli"
version = "0.2.0"
edition = "2024"

[lib]
name = "cvapp_cli"
path = "src/lib.rs"

[[bin]]
name = "cvapp"
path = "src/main.rs"

[dependencies]
cvapp = { path = "../.." }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.28", features = ["v4"] }
colored = "3.0"
zip = { version = "9.0.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
