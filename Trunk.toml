[build]
target = "index.html"
dist = "dist"

[serve]
port = 8080
open = false

[watch]
ignore = [
    "style/tailwind.css",
    "src-tauri",
    "dist",
    "target",
    "scratch"
]

[[hooks]]
stage = "pre_build"
command = "bunx"
command_arguments = ["@tailwindcss/cli", "-i", "tailwind.css", "-o", "style/tailwind.css", "--minify"]
