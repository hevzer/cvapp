[tools]
rust = "1.99.0"
"cargo:trunk" = "latest"
"cargo:tauri-cli" = "latest"
cargo-binstall = "latest"
bun = "latest"

[tasks.dev]
description = "Start Leptos web development server with hot-reload"
run = "trunk serve"

[tasks.build]
description = "Build production WebAssembly package"
run = "trunk build --release"

[tasks."desktop:dev"]
description = "Start Tauri desktop app in development mode"
run = "cargo tauri dev"

[tasks."desktop:build"]
description = "Build release desktop installer with Tauri"
run = "cargo tauri build"

[tasks.test]
description = "Run unit test suite"
run = "cargo test --lib"

[tasks.setup]
description = "Detect OS and install required system desktop libraries"
run = """
if command -v dnf >/dev/null 2>&1; then
  echo "Detected Fedora/RHEL system. Installing desktop development packages..."
  sudo dnf install -y webkit2gtk4.1-devel gtk3-devel openssl-devel libappindicator-gtk3-devel librsvg2-devel
elif command -v apt-get >/dev/null 2>&1; then
  echo "Detected Debian/Ubuntu system. Installing desktop development packages..."
  sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
elif command -v pacman >/dev/null 2>&1; then
  echo "Detected Arch Linux system. Installing desktop development packages..."
  sudo pacman -S --needed webkit2gtk-4.1 gtk3 cairo openssl
elif command -v zypper >/dev/null 2>&1; then
  echo "Detected openSUSE system. Installing desktop development packages..."
  sudo zypper install -y webkit2gtk3-devel gtk3-devel libopenssl-devel
else
  echo "No Linux package manager detected. On Windows and macOS, native webview runtimes (WebView2 / WebKit) are provided by the operating system."
fi
"""


